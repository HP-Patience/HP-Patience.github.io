version: 5.1.0
variant: default

head:
    meta:
        - '<meta name="keywords" content="AI大模型,深度学习,编程技术,Python,机器学习,技术博客,学习记录" />'
        - '<meta name="description" content="专注于AI大模型、深度学习、编程技术的学习博客，分享费曼学习法实践与技术成长之路。" />'
    manifest:
        name: 'Celyn_blog'
        short_name: 'Celyn'
        description: 'AI学习与技术分享博客'
        theme_color: '#ffffff'
        background_color: '#ffffff'
        icons:
            - src: '/img/logo.svg'
              sizes: '192x192'
              type: 'image/svg+xml'
    open_graph:
        type: 'website'
        site_name: 'Celyn_blog | AI学习与技术分享'
        twitter_card: 'summary_large_image'
        twitter_site: '@Celyn'
    structured_data:
        type: 'Blog'
        publisher: 'Celyn_blog'
    canonical_url: true
    rss: /atom.xml
    favicon: /img/favicon.svg

navbar:
    menu:
        Home: /
        Archives: /archives
        Categories: /categories
        Tags: /tags
        Gallery: https://gallery-xi-jet.vercel.app
        Story: /story
        About: /about
    links:
        GitHub:
            icon: fab fa-github
            url: https://github.com/HP-Patience

sidebar:
    left:
        sticky: false
    right:
        sticky: false

widgets:
    - position: left
      type: profile
      author: Celyn
      author_title: Blog Author
      bio: 费曼学习法，反思近期所学并反馈输出，将所学知识内化。
      location: Shanghai, China
      avatar: https://cdn.jsdelivr.net/gh/HP-Patience/HP-Patience.github.io@main/source/avatar_img/me.jpg
      follow_link: https://github.com/HP-Patience
      social_links:
          GitHub:
              icon: fab fa-github
              url: https://github.com/HP-Patience
          Email:
              icon: fas fa-envelope
              url: mailto:1249140039@qq.com
          Twitter:
              icon: fab fa-twitter
              url: https://twitter.com
          RSS:
              icon: fas fa-rss
              url: /atom.xml
    - position: left
      type: heatmap
      title: 活动热力图
    - position: left
      type: links
      exclude: ['post']
      links:
          Hexo: https://hexo.io
          Icarus: https://github.com/ppoffice/hexo-theme-icarus
    - position: left
      type: toc
      include: ['post']
      post: true
      index: false
      collapsed: false
    - position: left
      type: categories
      include: ['post']
      limit: 0
    - position: right
      type: recent_posts
      exclude: ['post']
      limit: 5
    - position: right
      type: archives
      exclude: ['post']
      limit: 10
      group_by: monthly
    - position: left
      type: tags
      limit: 20
      orderby: random


toc: true

article:
    highlight:
        theme: atom-one-light
        clipboard: true
        fold: unfolded
    readtime: true
    update_time: true

search:
    type: insight
    insight:
        cdn: true

comment:
    type: utterances
    repo: HP-Patience/HP-Patience.github.io
    issue_term: title
    theme: github-light

share:
    type: addtoany

footer:
    links:
        Hexo:
            icon: fab fa-hexagon
            url: https://hexo.io
        Icarus:
            icon: fab fa-feather
            url: https://github.com/ppoffice/hexo-theme-icarus

plugins:
    back_to_top: true
    pjax: true
    aplayer: true
    # cookie_consent:
    #     type: info
    #     theme: edgeless
    #     static: false
    #     position: bottom-left
    #     policyLink: 'https://www.cookiesandyou.com/'

providers:
    cdn: jsdelivr
